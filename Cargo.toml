[package]
name = "cipherbox-pqc-native"
version = "0.7.0"
edition = "2024"
authors = ["Thomas <selfworker112@mailfence.com>"]
description = "Post-Quantum Cryptography for Servers (ML-KEM-768/1024, X25519 hybrid KEM, ML-DSA-65/87, ChaCha20, Argon2) and CLI tools"
license = "MIT"
repository = "https://github.com/thomas666-beast/cipherbox-pqc-native"
keywords = ["pqc", "cryptography", "cli", "post-quantum", "kyber"]
categories = ["cryptography", "command-line-utilities"]

[[bin]]
name = "cipherbox-pqc-verify"
path = "src/bin/verify.rs"

[[bin]]
name = "cipherbox-pqc-wrap"
path = "src/bin/wrap.rs"

[[bin]]
name = "cipherbox-pqc-unwrap"
path = "src/bin/unwrap.rs"

[[bin]]
name = "cipherbox-pqc-room-verifier"
path = "src/bin/room_verifier.rs"

[[bin]]
name = "cipherbox-pqc-keygen"
path = "src/bin/keygen.rs"

[[bin]]
name = "cipherbox-pqc-file-encrypt"
path = "src/bin/file_encrypt.rs"

[[bin]]
name = "cipherbox-pqc-file-decrypt"
path = "src/bin/file_decrypt.rs"

[dependencies]
cipherbox-pqc-core = { path = "../cipherbox-pqc-core", version = "0.7.0" }
base64 = "0.22"
zeroize = "1"
ml-dsa = "=0.1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
